name: Build Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  #  macOS Build (runs on Apple hardware — required for .dmg signing)
  # ──────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin   # Apple Silicon (M1/M2/M3)
          - x86_64-apple-darwin    # Intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci

      - name: Build macOS app
        run: npx tauri build --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable code signing for unsigned community builds:
          APPLE_SIGNING_IDENTITY: '-'

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  #  Windows Build
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (.exe / .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Windows app
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TARGET_DIR: target

      - name: Upload NSIS .exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

  # ──────────────────────────────────────────────────────────────────────────
  #  Create GitHub Release with all artifacts
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Maina ${{ github.ref_name }}
          body: |
            ## Maina ${{ github.ref_name }}

            ### Download
            | Platform | File |
            |----------|------|
            | Windows (Recommended) | `Maina_*_x64-setup.exe` |
            | Windows (MSI) | `Maina_*_x64_en-US.msi` |
            | macOS Apple Silicon | `Maina_*_aarch64.dmg` |
            | macOS Intel | `Maina_*_x64.dmg` |

            > **Note:** macOS builds are unsigned. You may need to right-click → Open to bypass Gatekeeper.
          files: artifacts/**/*
          draft: false
          prerelease: false
