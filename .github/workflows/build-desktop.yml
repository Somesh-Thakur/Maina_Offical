name: Build Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # allows manual trigger from Actions tab

permissions:
  contents: write

# ─── Shared setup steps (used in all build jobs) ─────────────────────────────
# Note: GitHub Actions doesn't support YAML anchors, so steps are repeated.
# Kept minimal to avoid drift.

jobs:
  # ────────────────────────────────────────────────────────────────
  #  macOS — Apple Silicon (M1/M2/M3)
  # ────────────────────────────────────────────────────────────────
  build-macos-arm:
    name: macOS · Apple Silicon
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust + aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Tauri CLI deps
        run: npm install
        working-directory: desktop

      # Tauri requires frontendDist to exist even when the window loads a URL
      - name: Create dist placeholder
        run: |
          mkdir -p desktop/dist
          echo '<html><body></body></html>' > desktop/dist/index.html

      - name: Build (aarch64-apple-darwin)
        run: npx @tauri-apps/cli build --target aarch64-apple-darwin
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  # ────────────────────────────────────────────────────────────────
  #  macOS — Intel x64
  # ────────────────────────────────────────────────────────────────
  build-macos-intel:
    name: macOS · Intel x64
    runs-on: macos-13   # last Intel GitHub-hosted runner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust + x86_64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Tauri CLI deps
        run: npm install
        working-directory: desktop

      - name: Create dist placeholder
        run: |
          mkdir -p desktop/dist
          echo '<html><body></body></html>' > desktop/dist/index.html

      - name: Build (x86_64-apple-darwin)
        run: npx @tauri-apps/cli build --target x86_64-apple-darwin
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel-dmg
          path: desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  # ────────────────────────────────────────────────────────────────
  #  Windows — x64 (.exe + .msi)
  # ────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows · x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Tauri CLI deps
        run: npm install
        working-directory: desktop

      - name: Create dist placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/dist | Out-Null
          Set-Content -Path desktop/dist/index.html -Value '<html><body></body></html>'

      - name: Build
        run: npx @tauri-apps/cli build
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: desktop/src-tauri/target/release/bundle/msi/*.msi

  # ────────────────────────────────────────────────────────────────
  #  Create GitHub Release (only on tag push)
  # ────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-macos-arm, build-macos-intel, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          name: "Maina ${{ github.ref_name }}"
          body: |
            ## 🎵 Maina ${{ github.ref_name }}

            | Platform | File | Notes |
            |----------|------|-------|
            | Windows (Installer) | `Maina_*_x64-setup.exe` | Recommended |
            | Windows (MSI) | `Maina_*_x64_en-US.msi` | Alternative |
            | macOS Apple Silicon | `Maina_*_aarch64.dmg` | M1 / M2 / M3 |
            | macOS Intel | `Maina_*_x64.dmg` | Intel Macs |

            > **macOS:** Not Apple-signed — right-click → Open on first launch to bypass Gatekeeper.

            🌐 [maina-offical.vercel.app](https://maina-offical.vercel.app)
          files: artifacts/**/*
          draft: false
          prerelease: false
